name: Isolated verification
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: yanhuo_ci
          POSTGRES_USER: yanhuo
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yanhuo -d yanhuo_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_ENV: development
      DEMO_MODE: 'true'
      DATABASE_URL: postgresql://yanhuo:disposable-ci-only@127.0.0.1:5432/yanhuo_ci
      DB_SSLMODE: disable
      WECHAT_PAY_ENABLED: 'false'
      WECHAT_PAY_CONFIG_FILE: ''
      AMAP_KEY: ''
      AMAP_SECURITY_CODE: ''
      RUNTIME_ACCEPTANCE_EVIDENCE_DIR: ${{ github.workspace }}/backend/test-results/notification-processes
      RUNTIME_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: python -m pip install -r backend/requirements.txt
      - name: Configuration and migration consistency
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: PostgreSQL / PostGIS regression
        working-directory: backend
        run: |
          mkdir -p test-results
          set -o pipefail
          python manage.py test market --noinput --verbosity 2 2>&1 | tee test-results/ci-postgres.log
      - name: Deployment and backup safety tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Real encrypted bundle round trip (synthetic files only)
        run: |
          sudo apt-get update
          sudo apt-get install -y restic
          python scripts/verify_backup_bundle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: backend-results, path: backend/test-results/, retention-days: 14}
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - name: Type check and production build
        id: browser-build
        run: npm run build
        working-directory: frontend
      - name: Discovery, cart and notification unit tests
        run: npm run test:unit
        working-directory: frontend
      - name: Chromium and WebKit regressions / production startup
        working-directory: frontend
        run: npx playwright test --config playwright.ci.config.ts
      - name: Repeat weak-network checkout, identity recovery, merchant actions and payment polling
        if: ${{ !cancelled() && steps.browser-build.outcome == 'success' }}
        working-directory: frontend
        env:
          E2E_OUTPUT_DIR: test-results/weak-network
          E2E_REPORT_DIR: playwright-report/weak-network
        run: npx playwright test --config playwright.ci.config.ts checkout-recovery.spec.ts identity-refresh.spec.ts merchant-hardening.spec.ts payment-cooldown.spec.ts --project fixture-chromium --project student-webkit --project merchant-webkit --repeat-each=3
      - name: Real API integration in disposable SQLite and media
        if: ${{ !cancelled() && steps.browser-build.outcome == 'success' }}
        run: python scripts/verify_browser_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          include-hidden-files: true
          if-no-files-found: error
          path: |
            frontend/test-results/ci/
            frontend/test-results/weak-network/
            frontend/playwright-report/
            .runtime/browser-integration-*/
          retention-days: 14
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y restic openssh-client openssl
          python -m pip install -r backend/requirements.txt
      - name: HTTPS release gate, worker recovery, PostgreSQL contention, real notifications and encrypted restore
        run: python scripts/verify_runtime.py --evidence-dir .runtime/ci-runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-acceptance
          path: .runtime/ci-runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r backend/requirements.txt
      - run: npm ci --ignore-scripts && npm audit --audit-level=high
        working-directory: frontend
