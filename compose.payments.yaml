# Optional overlay. The base stack starts without any payment secrets directory.
# Keep using this overlay while old payments/refunds still require reconciliation,
# even after WECHAT_PAY_ENABLED is changed back to false.
services:
  backend:
    environment:
      WECHAT_PAY_CONFIG_FILE: /run/yanhuo-wechat/wechat-accounts.json
    volumes:
      - &wechat_secrets
        type: bind
        source: ${WECHAT_PAY_SECRETS_DIR:?Set an existing absolute directory outside the repository}
        target: /run/yanhuo-wechat
        read_only: true
        bind:
          create_host_path: false
  payment_worker:
    environment:
      WECHAT_PAY_CONFIG_FILE: /run/yanhuo-wechat/wechat-accounts.json
    volumes:
      - *wechat_secrets
  callback:
    environment:
      WECHAT_PAY_CONFIG_FILE: /run/yanhuo-wechat/wechat-accounts.json
    volumes:
      - *wechat_secrets
  notification_worker:
    environment:
      WECHAT_PAY_CONFIG_FILE: /run/yanhuo-wechat/wechat-accounts.json
    volumes:
      - *wechat_secrets
