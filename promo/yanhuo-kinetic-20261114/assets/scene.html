// LRU Bitmap Cache
const bitmapCache = new Map();
const MAX_CACHE = 42;

function pad4(n) {
  return String(n).padStart(4, '0');
}

async function getClipFrame(clipId, idx1Based) {
  const maxF = CLIP_COUNTS[clipId] || 60;
  const clamped = Math.max(1, Math.min(maxF, Math.round(idx1Based)));
  const key = `${clipId}/${clamped}`;
  if (bitmapCache.has(key)) {
    const bmp = bitmapCache.get(key);
    bitmapCache.delete(key);
    bitmapCache.set(key, bmp);
    return bmp;
  }
  const url = `/work/clips/${clipId}/f_${pad4(clamped)}.jpg`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Failed to load ${url}: ${res.status}`);
  const blob = await res.blob();
  const bmp = await createImageBitmap(blob);
  bitmapCache.set(key, bmp);
  if (bitmapCache.size > MAX_CACHE) {
    const oldestKey = bitmapCache.keys().next().value;
    const oldBmp = bitmapCache.get(oldestKey);
    bitmapCache.delete(oldestKey);
    if (oldBmp && oldBmp.close) oldBmp.close();
  }
  return bmp;
}

// Math & Easing Helpers
const clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = (t) => 1 - Math.pow(1 - clamp(t), 3);
const easeInOutCubic = (t) => {
  t = clamp(t);
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
};
const easeOutBack = (t, s = 1.55) => {
  t = clamp(t);
  return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
};
const springPop = (t) => {
  t = clamp(t);
  if (t <= 0) return 0;
  return 1 - Math.exp(-7.5 * t) * Math.cos(13.0 * t);
};

function roundRectPath(c, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + rr, y);
  c.arcTo(x + w, y, x + w, y + h, rr);
  c.arcTo(x + w, y + h, x, y + h, rr);
  c.arcTo(x, y + h, x, y, rr);
  c.arcTo(x, y, x + w, y, rr);
  c.closePath();
}

function drawCover(c, img, scale = 1.0, panX = 0, panY = 0) {
  const dw = W * scale;
  const dh = H * scale;
  const dx = (W - dw) * 0.5 + panX;
  const dy = (H - dh) * 0.5 + panY;
  c.drawImage(img, dx, dy, dw, dh);
}

function drawVignette(c, strength = 0.45) {
  const g = c.createRadialGradient(W * 0.5, H * 0.5, H * 0.28, W * 0.5, H * 0.5, W * 0.68);
  g.addColorStop(0, 'rgba(12,9,7,0)');
  g.addColorStop(1, `rgba(10,7,5,${strength})`);
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);
}

function drawPill(c, x, y, text, bg, fg, fontSize = 26, padX = 26, padY = 13, borderColor = null) {
  c.save();
  c.font = `700 ${fontSize}px "Microsoft YaHei UI", "Noto Sans SC", sans-serif`;
  const tw = c.measureText(text).width;
  const bw = tw + padX * 2;
  const bh = fontSize + padY * 2;
  roundRectPath(c, x - bw * 0.5, y - bh * 0.5, bw, bh, bh * 0.5);
  c.fillStyle = bg;
  c.fill();
  if (borderColor) {
    c.lineWidth = 2.5;
    c.strokeStyle = borderColor;
    c.stroke();
  }
  c.fillStyle = fg;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText(text, x, y + 1);
  c.restore();
  return { bw, bh };
}

// Procedural Studio Reflection Environment Map (for realistic metallic titanium & glass!)
function createStudioEnvMap() {
  const envC = document.createElement('canvas');
  envC.width = 512; envC.height = 256;
  const ec = envC.getContext('2d');
  const grad = ec.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#2a211b');
  grad.addColorStop(0.48, '#17120e');
  grad.addColorStop(1, '#0b0908');
  ec.fillStyle = grad;
  ec.fillRect(0, 0, 512, 256);
  // Warm key softbox strip + cool rim strip + top ceiling light
  ec.fillStyle = '#ffcfb3';
  ec.fillRect(55, 28, 120, 42);
  ec.fillStyle = '#ffe9d6';
  ec.fillRect(210, 14, 150, 26);
  ec.fillStyle = '#ffd1a8';
  ec.fillRect(380, 48, 95, 55);
  const tex = new THREE.CanvasTexture(envC);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envRT = pmrem.fromEquirectangular(tex);
  pmrem.dispose();
  tex.dispose();
  return envRT.texture;
}
scene.environment = createStudioEnvMap();

// Helper: Extruded Chamfered 3D Titanium Smartphone Builder
function create3DPhoneRig() {
  const group = new THREE.Group();
  const pw = 4.3, ph = 8.75, radius = 0.68, depth = 0.34;
  const shape = new THREE.Shape();
  const x = -pw / 2, y = -ph / 2;
  shape.moveTo(x + radius, y);
  shape.lineTo(x + pw - radius, y);
  shape.quadraticCurveTo(x + pw, y, x + pw, y + radius);
  shape.lineTo(x + pw, y + ph - radius);
  shape.quadraticCurveTo(x + pw, y + ph, x + pw - radius, y + ph);
  shape.lineTo(x + radius, y + ph);
  shape.quadraticCurveTo(x, y + ph, x, y + ph - radius);
  shape.lineTo(x, y + radius);
  shape.quadraticCurveTo(x, y, x + radius, y);

  const chassisGeo = new THREE.ExtrudeGeometry(shape, {
    depth,
    bevelEnabled: true,
    bevelSegments: 5,
    steps: 1,
    bevelSize: 0.065,
    bevelThickness: 0.065,
  });
  chassisGeo.center();
  const chassisMat = new THREE.MeshStandardMaterial({
    color: 0x3b3530,
    metalness: 0.88,
    roughness: 0.22,
  });
  const chassis = new THREE.Mesh(chassisGeo, chassisMat);
  chassis.castShadow = true;
  chassis.receiveShadow = true;
  group.add(chassis);

  // Side Metallic Buttons
  const btnGeo = new THREE.BoxGeometry(0.06, 0.85, 0.14);
  const btnMat = new THREE.MeshStandardMaterial({ color: 0xd6cbc2, metalness: 0.92, roughness: 0.18 });
  const btnR = new THREE.Mesh(btnGeo, btnMat);
  btnR.position.set(pw / 2 + 0.07, 1.1, 0);
  group.add(btnR);

  // OLED Screen Canvas & Texture
  const screenCanvas = document.createElement('canvas');
  screenCanvas.width = 860;
  screenCanvas.height = 1750;
  const screenCtx = screenCanvas.getContext('2d');
  const screenTex = new THREE.CanvasTexture(screenCanvas);
  screenTex.colorSpace = THREE.SRGBColorSpace;
  screenTex.anisotropy = 8;

  // Rounded front OLED plane slightly proud of front bevel
  const scrW = pw - 0.24, scrH = ph - 0.24, scrR = radius - 0.10;
  const scrShape = new THREE.Shape();
  const sx = -scrW / 2, sy = -scrH / 2;
  scrShape.moveTo(sx + scrR, sy);
  scrShape.lineTo(sx + scrW - scrR, sy);
  scrShape.quadraticCurveTo(sx + scrW, sy, sx + scrW, sy + scrR);
  scrShape.lineTo(sx + scrW, sy + scrH - scrR);
  scrShape.quadraticCurveTo(sx + scrW, sy + scrH, sx + scrW - scrR, sy + scrH);
  scrShape.lineTo(sx + scrR, sy + scrH);
  scrShape.quadraticCurveTo(sx, sy + scrH, sx, sy + scrH - scrR);
  scrShape.lineTo(sx, sy + scrR);
  scrShape.quadraticCurveTo(sx, sy, sx + scrR, sy);

  const scrGeo = new THREE.ShapeGeometry(scrShape, 12);
  // Normalize UVs 0..1 across scrW x scrH
  const pos = scrGeo.attributes.position;
  const uvs = new Float32Array(pos.count * 2);
  for (let i = 0; i < pos.count; i++) {
    uvs[i * 2] = (pos.getX(i) - sx) / scrW;
    uvs[i * 2 + 1] = (pos.getY(i) - sy) / scrH;
  }
  scrGeo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

  const scrMat = new THREE.MeshBasicMaterial({ map: screenTex });
  const screenMesh = new THREE.Mesh(scrGeo, scrMat);
  screenMesh.position.z = depth / 2 + 0.068;
  group.add(screenMesh);

  // Subtle Glass Specular Overlay Plane
  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.11,
    roughness: 0.05,
    metalness: 0.1,
    clearcoat: 1.0,
  });
  const glassMesh = new THREE.Mesh(scrGeo, glassMat);
  glassMesh.position.z = depth / 2 + 0.072;
  group.add(glassMesh);

  // Detached Z-Floating Popout Card (for Apple-style 3D UI detachment!)
  const popCanvas = document.createElement('canvas');
  popCanvas.width = 900;
  popCanvas.height = 300;
  const popCtx = popCanvas.getContext('2d');
  const popTex = new THREE.CanvasTexture(popCanvas);
  popTex.colorSpace = THREE.SRGBColorSpace;
  const popGeo = new THREE.PlaneGeometry(4.35, 1.45);
  const popMat = new THREE.MeshBasicMaterial({ map: popTex, transparent: true });
  const popMesh = new THREE.Mesh(popGeo, popMat);
  popMesh.position.set(0, 0.7, depth / 2 + 0.48);
  group.add(popMesh);

  return { group, screenCanvas, screenCtx, screenTex, popCanvas, popCtx, popTex, popMesh };
}

function paintReceiptTexture(c, t) {
  const rw = 1024, rh = 1800;
  c.clearRect(0, 0, rw, rh);

  // Serrated Thermal Paper Path
  c.save();
  c.beginPath();
  const teeth = 26;
  const step = rw / teeth;
  c.moveTo(0, 34);
  for (let i = 0; i < teeth; i++) {
    c.lineTo(i * step + step * 0.5, 4);
    c.lineTo((i + 1) * step, 34);
  }
  c.lineTo(rw, rh - 34);
  for (let i = teeth; i > 0; i--) {
    c.lineTo(i * step - step * 0.5, rh - 4);
    c.lineTo((i - 1) * step, rh - 34);
  }
  c.closePath();
  c.fillStyle = '#fffdf7';
  c.fill();

  // Subtle thermal paper grain lines
  c.strokeStyle = 'rgba(120,100,80,0.12)';
  c.lineWidth = 3;
  c.setLineDash([14, 10]);
  c.beginPath();
  c.moveTo(64, 250); c.lineTo(rw - 64, 250);
  c.moveTo(64, 1520); c.lineTo(rw - 64, 1520);
  c.stroke();
  c.setLineDash([]);

  // Receipt Header
  c.fillStyle = '#302b26';
  c.font = '900 62px "Microsoft YaHei UI", sans-serif';
  c.textAlign = 'center';
  c.fillText('烟火地图 · 预订小票', rw / 2, 138);
  c.fillStyle = '#e86a27';
  c.font = '700 34px "Microsoft YaHei UI", sans-serif';
  c.fillText('老周铁板炒面 · 线上余 18 份', rw / 2, 204);

  const items = [
    { trig: 12.25, num: '#01', dish: '招牌铁板炒面', tag: '不要香菜', color: '#e86a27', y: 410 },
    { trig: 13.50, num: '#02', dish: '招牌铁板炒面', tag: '加酸笋 · 微辣', color: '#d9480f', y: 780 },
    { trig: 14.75, num: '#03', dish: '手打暴打柠檬茶', tag: '少冰 · 免费逐份备注', color: '#3d7a57', y: 1150 },
  ];

  for (const it of items) {
    if (t >= it.trig - 0.05) {
      const p = springPop((t - it.trig) / 0.34);
      c.save();
      c.translate(rw / 2, it.y);
      const sc = lerp(1.65, 1.0, clamp(p, 0, 1.12));
      c.scale(sc, sc);

      roundRectPath(c, -410, -115, 820, 235, 32);
      c.fillStyle = '#fff6eb';
      c.fill();
      c.lineWidth = 4;
      c.strokeStyle = it.color;
      c.stroke();

      c.textAlign = 'left';
      c.fillStyle = it.color;
      c.font = '900 42px "Microsoft YaHei UI", sans-serif';
      c.fillText(it.num, -365, -35);

      c.fillStyle = '#26201b';
      c.font = '800 50px "Microsoft YaHei UI", sans-serif';
      c.fillText(it.dish, -245, -33);

      // Stamp Tag
      roundRectPath(c, -365, 20, 730, 74, 20);
      c.fillStyle = it.color;
      c.fill();
      c.fillStyle = '#ffffff';
      c.font = '800 38px "Microsoft YaHei UI", sans-serif';
      c.textAlign = 'center';
      c.fillText(it.tag, 0, 68);
      c.restore();
    }
  }

  c.fillStyle = '#6f675d';
  c.font = '700 34px "Microsoft YaHei UI", sans-serif';
  c.textAlign = 'center';
  c.fillText('多份同点 · 每份口味独立编号', rw / 2, 1625);
  c.restore();
}

// Giant RSVP Center Knockout Title Helper
function drawCenterPunchText(out, mainText, subTag, localProgress, accent = '#ff7a2f') {
  const sc = lerp(1.28, 1.0, easeOutBack(localProgress / 0.28, 1.35));
  out.save();
  out.translate(W / 2, H / 2);
  out.scale(sc, sc);

  if (subTag) {
    drawPill(out, 0, -135, subTag, 'rgba(18,13,10,0.78)', '#ffd8b5', 24, 24, 10, accent);
  }

  out.font = '900 168px "Microsoft YaHei UI", "Noto Sans SC", sans-serif';
  out.textAlign = 'center';
  out.textBaseline = 'middle';
  out.shadowColor = 'rgba(0,0,0,0.72)';
  out.shadowBlur = 36;
  out.shadowOffsetY = 12;
  out.lineWidth = 14;
  out.strokeStyle = 'rgba(18,12,8,0.85)';
  out.strokeText(mainText, 0, 12);
  out.fillStyle = '#fffdf9';
  out.fillText(mainText, 0, 12);
  out.restore();
}

    const u = t / 0.75;
    const bmp = await getClipFrame('c01_wok_fire', 1 + Math.floor(t * 60));
    drawCover(out, bmp, lerp(1.02, 1.12, u), 0, 0);
    drawVignette(out, 0.42);
    drawCenterPunchText(out, '十点下课', '22:10 · 校门口夜宵时刻', u, '#ff7a2f');
  } else if (t < 1.50) {
    const u = (t - 0.75) / 0.75;
    const bmp = await getClipFrame('c02_sauce_toss', 1 + Math.floor((t - 0.75) * 60));
    drawCover(out, bmp, lerp(1.03, 1.13, u), 0, 0);
    drawVignette(out, 0.42);
    drawCenterPunchText(out, '就馋这一口', '铁板猛火 · 热油兹拉', u, '#f59e0b');
  } else if (t < 2.00) {
    const u = (t - 1.50) / 0.50;
    const bmp = await getClipFrame('c03_noodles_lift', 1 + Math.floor((t - 1.50) * 60));
    drawCover(out, bmp, lerp(1.02, 1.11, u), 0, 0);
    drawVignette(out, 0.38);
    drawCenterPunchText(out, '下楼去追！', null, u, '#e86a27');
  } else {
    const u = (t - 2.00) / 0.50;
    const bmp = await getClipFrame('c04_sprint_steps', 1 + Math.floor((t - 2.00) * 60));
    drawCover(out, bmp, lerp(1.04, 1.18, u), lerp(0, -45, u), 0);
    drawVignette(out, 0.35);
    drawCenterPunchText(out, '冲向南门', null, u, '#e86a27');
  }
}

  ];

    out.shadowColor = 'transparent';

    out.save();
    roundRectPath(out, -cd.w / 2, -cd.h / 2, cd.w, cd.h, 14);
    out.clip();

  // Three.js 3D Fluttering Serrated Thermal Paper Receipt Down Center!
  setOnlyGroup(gReceipt);
  paintReceiptTexture(receiptCtxProxy(), t);
  receiptTex.needsUpdate = true;

  // Vertex wave deformation for tactile paper physics
  const posAttr = recGeo.attributes.position;
  for (let i = 0; i < posAttr.count; i++) {
    const bx = recBasePos[i * 3];
    const by = recBasePos[i * 3 + 1];
    const normY = (3.9 - by) / 7.8; // 0 at top slot, 1 at bottom
    const waveZ = Math.sin(normY * 4.2 - t * 5.2) * 0.24 * normY + Math.cos(bx * 0.8 + t * 3.0) * 0.06;
    posAttr.setZ(i, waveZ);
  }
  posAttr.needsUpdate = true;
  recGeo.computeVertexNormals();

  const feedP = easeOutCubic(clamp(localT / 0.65));
  receiptMesh.position.set(0, lerp(3.4, -0.15, feedP), 0.15);
  receiptMesh.rotation.y = Math.sin(localT * 1.6) * 0.12;

  // Subtle camera punch on each ink stamp (12.25, 13.50, 14.75)
  let shakeY = 0;
  for (const st of [12.25, 13.50, 14.75]) {
    if (t >= st && t < st + 0.18) {
      shakeY += Math.sin((t - st) * 90) * Math.exp(-(t - st) * 22) * 0.14;
    }
  }
  camera.position.set(0, 0.30 + shakeY, 12.2);
  camera.lookAt(0, 0.15, 0);
  renderer.render(scene, camera);
  out.drawImage(glCanvas, 0, 0);
}

// Dispatch single clean state at time `t` onto `targetCtx`
async function renderCleanAt(targetCtx, t) {
  if (t < 2.50) {
    await renderShot01_04(targetCtx, t);
  } else if (t < 4.25) {
    await renderShot05_EmptyGate(targetCtx, t);
  } else if (t < 6.00) {
    await renderShot06_MacroPhone(targetCtx, t);
  } else if (t < 11.50) {
    renderShot07_08_Campus3D(targetCtx, t);
  } else if (t < 16.00) {
    await renderShot09_ThermalReceipt(targetCtx, t);
  } else if (t < 20.00) {
    await renderShot10_SplitWokMerchant(targetCtx, t);
  } else if (t < 24.50) {
    renderShot11_DualPhones(targetCtx, t);
  } else if (t < 30.00) {
    renderShot12_ComplianceSculpture(targetCtx, t);
  } else if (t < 34.00) {
    await renderShot13_SensoryPayoff(targetCtx, t);
  } else {
    await renderShot14_BrandFinale(targetCtx, t);
  }
}

// Edgar Wright Optical Multi-Tap Whip-Pan Transitions!
const WHIPS = [
  { center: 2.50, half: 0.09, dirX: -1, dirY: 0 },   // Whip RIGHT into Empty Gate
  { center: 4.25, half: 0.09, dirX:  1, dirY: 0 },   // Whip LEFT into 3D Macro Phone
  { center: 11.50, half: 0.10, dirX: 0, dirY: -1 },  // Whip UP into Flying Thermal Receipt
  { center: 20.00, half: 0.10, dirX: -1, dirY: 0 },  // Whip into Dual 3D Phones
  { center: 24.50, half: 0.10, dirX: 0, dirY:  1 },  // Whip into Ordinary Folk Sculpture
  { center: 30.00, half: 0.08, dirX: -1, dirY: 0 },  // Whip into Sensory Climax
  { center: 34.00, half: 0.11, dirX: 0, dirY: -1 },  // Whip into Warm Brand Finale
];

window.renderFrame = async function renderFrame(frameIdx) {
  const t = frameIdx / FPS;

  const activeWhip = WHIPS.find((w) => Math.abs(t - w.center) < w.half);
  if (!activeWhip) {
    await renderCleanAt(ctx, t);
    return masterCanvas.toDataURL('image/jpeg', 0.94);
  }

  // Render outgoing & incoming frames into bufA & bufB, then composite with 9-tap directional motion smear!
  const u = easeInOutCubic((t - (activeWhip.center - activeWhip.half)) / (activeWhip.half * 2));
  const tOut = Math.max(0, activeWhip.center - activeWhip.half - 0.002);
  const tIn = Math.min(37.98, activeWhip.center + activeWhip.half + 0.002);

  await renderCleanAt(ctxA, tOut);
  await renderCleanAt(ctxB, tIn);

  ctx.fillStyle = '#0f0c0a';
  ctx.fillRect(0, 0, W, H);

  const taps = 9;
  const blurSpan = Math.sin(Math.PI * u) * 150;
  ctx.save();
  for (let i = 0; i < taps; i++) {
    const jitter = ((i / (taps - 1)) - 0.5) * blurSpan;
    ctx.globalAlpha = 1 / (i + 1 === 1 ? 1 : taps * 0.55);
    if (i === 0) ctx.globalAlpha = 1.0;
    else ctx.globalAlpha = 0.18;

    const shiftOutX = activeWhip.dirX * u * W + activeWhip.dirX * jitter;
    const shiftOutY = activeWhip.dirY * u * H + activeWhip.dirY * jitter;
    const shiftInX = shiftOutX - activeWhip.dirX * W;
    const shiftInY = shiftOutY - activeWhip.dirY * H;

    ctx.drawImage(bufA, shiftOutX, shiftOutY);
    ctx.drawImage(bufB, shiftInX, shiftInY);
  }
  ctx.restore();

  return masterCanvas.toDataURL('image/jpeg', 0.94);
};
