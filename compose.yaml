services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: yanhuo
      POSTGRES_USER: yanhuo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yanhuo -d yanhuo"]
      interval: 5s
      timeout: 5s
      retries: 20
  release:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    # A failed release never starts the application or any worker.
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    environment: &backend_environment
      DJANGO_ENV: production
      DEMO_MODE: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a random DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${PUBLIC_DOMAIN}
      DATABASE_URL: postgresql://yanhuo:${POSTGRES_PASSWORD}@db:5432/yanhuo
      DB_SSLMODE: disable
      TRUST_PROXY: "true"
      AUTH_TRUST_PROXY_CLIENT_IP: "true"
      AUTH_FAILURE_WINDOW_SECONDS: ${AUTH_FAILURE_WINDOW_SECONDS:-900}
      AUTH_FAILURE_ACCOUNT_LIMIT: ${AUTH_FAILURE_ACCOUNT_LIMIT:-10}
      AUTH_FAILURE_IP_LIMIT: ${AUTH_FAILURE_IP_LIMIT:-60}
      PUBLIC_BASE_URL: https://${PUBLIC_DOMAIN}
      # New payment creation remains disabled unless explicitly configured.
      WECHAT_PAY_ENABLED: ${WECHAT_PAY_ENABLED:-false}
      WECHAT_PAY_CONFIG_FILE: ""
      WECHAT_PAY_PUBLIC_ORIGIN: https://${PUBLIC_DOMAIN}
      # Enable only behind the supplied direct-facing Caddy proxy; see payments guide.
      WECHAT_PAY_TRUST_PROXY_CLIENT_IP: ${WECHAT_PAY_TRUST_PROXY_CLIENT_IP:-false}
      AMAP_KEY: ${AMAP_KEY:-}
      AMAP_SECURITY_CODE: ${AMAP_SECURITY_CODE:-}
      BRAND_NAME: ${BRAND_NAME:-烟火地图}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # No public port; only the direct-facing Caddy may supply trusted headers.
    command: ["waitress-serve", "--host=0.0.0.0", "--port=8000", "--threads=8", "--max-request-body-size=6291456", "--trusted-proxy=*", "--trusted-proxy-headers=x-forwarded-proto", "config.wsgi:application"]
    environment: *backend_environment
    depends_on:
      release:
        condition: service_completed_successfully
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client,os; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=5); c.request('GET','/api/v1/health',headers={'Host':os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0],'X-Forwarded-Proto':'https'}); assert c.getresponse().status==200"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  callback:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["waitress-serve", "--host=0.0.0.0", "--port=8088", "--threads=2", "--connection-limit=32", "--channel-timeout=30", "--max-request-body-size=2097152", "--trusted-proxy=*", "--trusted-proxy-headers=x-forwarded-proto", "config.callback_wsgi:application"]
    environment: *backend_environment
    depends_on:
      release:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c=http.client.HTTPConnection('127.0.0.1',8088,timeout=3); c.request('GET','/callback-health'); assert c.getresponse().status==200"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "manage.py", "expire_orders", "--loop"]
    environment: *backend_environment
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_operations", "--worker", "expire_orders"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      release:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
  payment_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "manage.py", "reconcile_payments", "--loop", "--interval", "30", "--limit", "100"]
    environment: *backend_environment
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_operations", "--worker", "reconcile_payments"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      release:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
  notification_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "manage.py", "process_payment_notifications", "--loop"]
    environment: *backend_environment
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_operations", "--worker", "process_payment_notifications"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      release:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - backend_static:/srv/backend-static:ro
      - backend_media:/srv/backend-media:ro
    depends_on:
      backend:
        condition: service_healthy
      callback:
        condition: service_healthy
volumes:
  database:
  backend_static:
  backend_media:
  caddy_data:
  caddy_config:
